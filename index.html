<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #191919;
      overflow: hidden;
    }
    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
  <script>
    const username = "d4n-onino";
    const repo = "Playlist";

    async function initWebamp() {
      let tracks = [];
      let skinUrl = new URL("skin.wsz?v=" + Date.now(), window.location.href).href;

      try {
        const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/?t=${Date.now()}`, {
          cache: "no-store"
        });
        const files = await res.json();

        tracks = files
          .filter(f => f.name.toLowerCase().endsWith(".mp3"))
          .map(f => ({
            metaData: { title: f.name.replace(/\.mp3$/i, "").replace(/[-_]/g, " ") },
            url: f.download_url
          }));

        const skinFile = files.find(f => f.name.toLowerCase().endsWith(".wsz"));
        if (skinFile) {
          skinUrl = `${skinFile.download_url}?t=${Date.now()}`;
        }
      } catch (e) {
        console.error("Failed to fetch files from GitHub:", e);
      }

      const webamp = new Webamp({
        initialSkin: { url: skinUrl },
        initialTracks: tracks
      });

      await webamp.renderWhenReady(document.getElementById("app"));
      webamp.setSkinFromUrl(skinUrl);
    }

    initWebamp();
  </script>
</body>
</html>
